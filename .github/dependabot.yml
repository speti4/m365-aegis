# Weekly dependency updates: the NuGet packages (Directory.Packages.props, the lock files and the local tool
# manifest), the .NET SDK pin of global.json, the front end's packages under gui/web and the SHA-pinned actions.
# A release is proposed only after a week, so a compromised or broken version has time to be yanked first.
# Security updates (a repository setting, docs/development.md) skip the cooldown.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # System.CommandLine 3.0 is an API migration, a task of its own (Directory.Packages.props).
      - dependency-name: System.CommandLine
        update-types: ["version-update:semver-major"]
      # Verify 33 is under the Open Source Maintenance Fee EULA and needs a sponsorship or an exemption declared in
      # the build; staying on the MIT line is a decision of the maintainer's (Directory.Packages.props).
      - dependency-name: Verify.XunitV3
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /gui/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
