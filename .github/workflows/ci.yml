# The checks of every push to main and every pull request: the Linux jobs carry everything that does not need
# Windows (restore in locked mode, build with the analyzers, the format check, the Core and Cli tests with the
# sidecar against a fake module under the runner's pwsh, the package audit and license check, the front end's lint,
# type check, tests and build, the sidecar's Pester tests, the changelog and fixture checks, the workflow lint),
# and the one Windows job (the published exes, the window's smoke test, the tests on Windows) runs on every push to
# main, every pull request and every tag (task 068: the repository is public since D-010, so its standard runners
# are free and D-005's pull-request-only rule fell). The three test jobs measure their coverage and fail below
# 100% of the lines and the branches (the sidecar: of its commands), with the reports as run artifacts (task 070). The ruleset on `main` requires every
# job, so no path filter on the trigger (a required check whose workflow never starts stays pending and blocks
# the merge); instead the first job, `changes`, diffs the change, and the five build jobs are skipped, which
# still passes their required checks, when only docs, tasks, memory, the changelog or a root markdown file
# changed. `lint`, `workflow-lint` and the commit rules (their own workflow, commit-rules.yml) run on every
# change. A tag also publishes the signed zip, its checksum, its build provenance attestation and the notes from the
# changelog. Every restore runs in locked mode (RestoreLockedMode in CI), so a stale lock file fails
# instead of being rewritten. Actions are pinned by commit SHA and bumped by dependabot.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Vite 8 warns when its config is loaded by the native runtime; the warning is noise in a log.
  VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request run; a running main or tag run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change touches: `code` is false when every changed path is docs, tasks, memory, the changelog or a
  # root markdown file, and the build jobs below skip on it. A pull request is diffed against its merge base, a
  # push against the commit before it; a tag, a manual run, a first push or an unknown base is the full run.
  # The build jobs read the output through `needs`, with `!cancelled()` so a failed `changes` job (an empty
  # output) runs them all rather than skipping them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base of the diff must be in the clone.
          fetch-depth: 0
      - id: diff
        name: Is there code in the change?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
          elif [ "$EVENT" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
               git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            files=
          fi
          if [ -z "$files" ]; then
            echo "no diff to classify ($EVENT): the full run"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          for file in $files; do
            case "$file" in
              docs/*|tasks/*|.claude/memory/*|CHANGELOG.md) kind=docs ;;
              */*) kind=code ;;
              *.md) kind=docs ;;
              *) kind=code ;;
            esac
            echo "$kind  $file"
            if [ "$kind" = code ]; then code=true; fi
          done
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The .NET side on the cheapest runner: locked restore, format, the analyzers in the build, the Core and Cli
  # tests (the Cli ones start the built assembly as a child process; the doctor finds the runner's pwsh) under
  # coverlet, whose instrumented assemblies also count the hits of those child processes; the gate merges the two
  # projects' reports and fails below 100% of the lines or the branches of the Core and the command line.
  dotnet:
    needs: [changes]
    # Skipped on a docs-only change (see `changes`); a skipped job still passes its required check.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      # The front end is built by its own job; the GUI project compiles here with an empty wwwroot.
      - run: dotnet build --no-restore -c Release -p:SkipFrontendBuild=true
      - run: dotnet test --no-build -c Release --coverlet --coverlet-output-format json --coverlet-output-format cobertura --results-directory "$GITHUB_WORKSPACE/TestResults/coverage"
      - name: Coverage of the Core and the command line
        run: python3 -I scripts/check-coverage.py TestResults/coverage --summary "$GITHUB_STEP_SUMMARY"
      # The reports also when the gate failed: that is when they are read.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-dotnet
          path: TestResults/coverage
          if-no-files-found: error

  # The dependency policy: a known vulnerability in any package (the restore's audit and the explicit script), a
  # license outside licenses/allowed.json (nuget-license over the shipped packages; the front end's packages from
  # the lock file), and npm's own audit of the shipped packages.
  deps:
    needs: [changes]
    # Skipped on a docs-only change, as `dotnet`.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: python3 -I scripts/check-vulnerable.py
      - run: dotnet tool restore
      - name: The licenses of the shipped packages
        run: dotnet nuget-license --input M365Aegis.slnx --include-transitive --allowed-license-types licenses/allowed.json --ignored-packages licenses/ignored.json --licensefile-to-license-mappings licenses/license-texts.json --exclude-projects-matching "*.Tests" --error-only
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No npm cache: a release is built in this workflow, and a cache a pull request wrote must not reach it.
          package-manager-cache: false
      - run: npm ci
        working-directory: gui/web
      - run: npm audit --omit=dev
        working-directory: gui/web
      - run: python3 -I scripts/npm-licenses.py

  # The front end: Biome (lint and format), the type check, the Vitest tests (they read the same bridge samples
  # the C# tests read) under V8 coverage, whose thresholds in vite.config.ts fail the run below 100%, and the Vite
  # build.
  frontend:
    needs: [changes]
    # Skipped on a docs-only change, as `dotnet`.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No npm cache: a release is built in this workflow, and a cache a pull request wrote must not reach it.
          package-manager-cache: false
      - run: npm ci
        working-directory: gui/web
      - run: npm run lint
        working-directory: gui/web
      - run: npm run typecheck
        working-directory: gui/web
      - run: npm run test:coverage
        working-directory: gui/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: gui/web/coverage
          if-no-files-found: error
      - run: npm run build
        working-directory: gui/web

  # The Exchange Online sidecar: PSScriptAnalyzer over the scripts and the Pester tests, which run the sidecar as a
  # child pwsh and in process against the fake module (tests/sidecar/modules), never against a tenant. The runner image carries
  # pwsh; Pester is installed in the version scripts/pester-version.txt names.
  sidecar:
    needs: [changes]
    # Skipped on a docs-only change, as `dotnet`.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          $pester = (Get-Content scripts/pester-version.txt -Raw).Trim()
          Install-Module Pester -RequiredVersion $pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # -Path takes one folder at a time.
          $findings = foreach ($folder in @('src/M365Aegis.Core/Exchange/Sidecar', 'tests/sidecar', 'tests/release', 'scripts')) {
            Invoke-ScriptAnalyzer -Path $folder -Recurse -Severity Warning, Error
          }
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if (@($findings).Count -gt 0) { exit 1 }
      # The tests run each case as a child pwsh (the process contract) and in this process over the script's
      # -In/-Out/-Log parameters, which is what the profiler-based coverage sees; the script fails below 100% of
      # the sidecar's commands (Pester has no branch measure).
      - name: Pester with the coverage of the sidecar script
        shell: pwsh
        run: tests/sidecar/run-with-coverage.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-sidecar
          path: TestResults/sidecar-coverage.xml
          if-no-files-found: error

  # The repo's own rules: the changelog matches tasks/done/ (not on a tag, see docs/development.md), the fixtures
  # carry made-up data only, and the helper scripts pass their self-checks.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history with the tags: scripts/changelog.py tells the tasks of a release by the tag trees.
          fetch-depth: 0
      - name: CHANGELOG.md is up to date
        if: github.ref_type != 'tag'
        run: python3 -I scripts/changelog.py --check
      - run: python3 -I scripts/check-fixtures.py
      - run: sh scripts/check-commit.sh --self-test

  # zizmor over the workflows and dependabot.yml; findings fail the job as annotations. No SARIF upload to code
  # scanning: an uploaded finding would not fail this required check.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  # The shipped platform, on every push to main, pull request and tag (task 068): the release script's dry run
  # publishes both exes with the front end and signs them with a throwaway certificate (task 085; no secret, so a
  # fork's pull request runs it too), the signing tests, the command line answers, the window loads the page and the
  # bridge works (--smoke), and the tests run on Windows. No coverage here: the Windows-only code is excluded from the
  # measure, so the `dotnet` job's gate on Linux holds the same 100% (docs/development.md, "Coverage").
  windows:
    needs: [changes]
    # Skipped on a docs-only change, as `dotnet`, and on a manual run of another branch.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name == 'pull_request' || github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No npm cache: a release is built in this workflow, and a cache a pull request wrote must not reach it.
          package-manager-cache: false
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: The command line answers
        shell: pwsh
        run: |
          $env:M365AEGIS_HOME = Join-Path $env:RUNNER_TEMP 'm365-aegis-home'
          & src/M365Aegis.Cli/bin/Release/net10.0/m365-aegis.exe --version
          & src/M365Aegis.Cli/bin/Release/net10.0/m365-aegis.exe --json doctor --offline
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }
          # No tenant profile in the empty home: the sign-in fails as an auth envelope, exit code 3, before MSAL is
          # called. The runner's pwsh turns a non-zero native exit code into an error and fails the step on the last
          # command's exit code, so the first is switched off and the step ends with an explicit zero.
          $PSNativeCommandUseErrorActionPreference = $false
          & src/M365Aegis.Cli/bin/Release/net10.0/m365-aegis.exe --json whoami
          if ($LASTEXITCODE -ne 3) { throw "whoami exited $LASTEXITCODE, expected 3" }
          exit 0
      - name: The window loads the page and the bridge answers
        shell: pwsh
        run: |
          $env:M365AEGIS_HOME = Join-Path $env:RUNNER_TEMP 'm365-aegis-home'
          $process = Start-Process -FilePath src/M365Aegis.Gui/bin/Release/net10.0-windows/m365-aegis-gui.exe -ArgumentList '--smoke' -PassThru -Wait -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt')
          Get-Content (Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt') -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "smoke exited $($process.ExitCode)" }
      # scripts/sign-release.ps1 over copies of the built files, the doctor's signature row over a signed folder, and
      # the release script's refusal without a certificate; Pester in the version scripts/pester-version.txt names.
      - name: The signing tests
        shell: pwsh
        run: |
          $pester = (Get-Content scripts/pester-version.txt -Raw).Trim()
          Install-Module Pester -RequiredVersion $pester -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion $pester
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/release'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      # The release job's path with a certificate made here, nothing trusts and no timestamp asked for (offline): the
      # exes and the product's assemblies are signed and verified before the zip is made.
      - name: The release script's dry run, signed with a throwaway certificate
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'test-signing.pfx'
          $null = tests/release/new-test-certificate.ps1 -Path $pfx
          scripts/release.ps1 -DryRun -CertificatePath $pfx -TimestampUrl ''

  # A v* tag on main: the signed zip, its checksum, its attestation and the notes as a GitHub release. The signing
  # certificate is the `release` environment's secret, never in the repo: SIGNING_CERTIFICATE holds the PFX file in
  # base64, SIGNING_CERTIFICATE_PASSWORD its password; without the first the release fails (docs/development.md,
  # "The release").
  release:
    needs: [dotnet, deps, frontend, sidecar, lint, workflow-lint, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # creates the release and uploads the zip
      id-token: write # the OIDC token that signs the build provenance attestation
      attestations: write # stores the attestation with the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history with the tags: scripts/changelog.py tells the tasks of a release by the tag trees.
          fetch-depth: 0
      # A release is cut from main only: the ruleset protects main, not every commit a tag could point at.
      - name: The tag is on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No npm cache: a release is built in this workflow, and a cache a pull request wrote must not reach it.
          package-manager-cache: false
      # The PFX is written to the runner's temporary folder for the run and removed after it; -RequireSignature fails
      # the release when the secret is missing, before anything is built.
      - name: Publish, sign and pack
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          M365AEGIS_SIGNING_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = ''
          if ($env:SIGNING_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [System.IO.File]::WriteAllBytes($pfx, [System.Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          }
          try {
            scripts/release.ps1 -Tag $env:TAG -CertificatePath $pfx -RequireSignature
          } finally {
            if ($pfx) { Remove-Item -Force $pfx }
          }
      # Build provenance for every file SHA256SUMS.txt lists, signed through the job's OIDC token and checked
      # with `gh attestation verify <zip> --repo speti4/m365-aegis`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
      # The runner's own gh CLI publishes the release: no third-party action holds the write token. The notes
      # are the tag's section of the changelog, written by release.ps1 (scripts/changelog.py --notes).
      - name: Publish the release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.Substring(1)
          gh release create $env:TAG "dist/m365-aegis-$version.zip" dist/SHA256SUMS.txt `
            --verify-tag --title "m365-aegis $version" --notes-file "dist/release-notes-$version.md"
