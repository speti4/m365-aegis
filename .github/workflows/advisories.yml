# A weekly fresh restore and audit over the lock files: a vulnerability published for a package that is already in
# packages.lock.json or gui/web/package-lock.json shows up here, without waiting for the next pull request to run
# the `deps` job of ci.yml. Not a required check (the ruleset requires that job on every change); a failed run is
# GitHub's usual notification of a failed scheduled workflow. It can also be started by hand (`gh workflow run
# advisories.yml`). Actions are pinned by commit SHA like the ones in ci.yml and bumped by dependabot.
name: advisories

on:
  schedule:
    # Mondays at 06:17 UTC, off the full hour when scheduled runs queue up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The restore itself fails on an advisory (NuGetAudit with warnings as errors); the script prints what it found.
      - run: dotnet restore --locked-mode
      - run: python3 -I scripts/check-vulnerable.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
        working-directory: gui/web
      - run: npm audit --omit=dev
        working-directory: gui/web
